name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install platform dependencies
        run: python -m pip install --only-binary=:all: -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile source
        run: python -m compileall -q hand_control tests scripts
      - name: Import without hardware access
        run: python scripts/check_imports.py
      - name: Unit tests (simulated mouse and audio)
        run: python -m unittest discover -s tests -v
